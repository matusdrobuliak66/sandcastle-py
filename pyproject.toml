[project]
name = "sandcastle-py"
version = "0.1.0"
description = "Minimal Python orchestrator for the pi coding agent in a locked-down Docker sandbox"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandcastle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires a local Docker daemon",
    "e2e: full end-to-end run, requires docker + pi + network to the model endpoint",
]
